server:
  port: 8080
  error:
    include-message: always

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${PROFILE}

    servlet:
      multipart:
        max-file-size: 7MB
        max-request-size: 7MB

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 200

cloud:
  aws:
    credentials:
      accessKey: ${AWS_S3_ACCESS_KEY}
      secretKey: ${AWS_S3_SECRET_KEY}
    region:
      static: ${AWS_S3_REGION}

management:
  security:
    enabled: false
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: prometheus, health
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

opensearch:
  endpoint: ${OPEN_SEARCH_ENDPOINT}
  username: ${OPEN_SEARCH_USERNAME}
  password: ${OPEN_SEARCH_PASSWORD}