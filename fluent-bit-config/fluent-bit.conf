[SERVICE]
    Flush            5
    Daemon           Off
    Log_Level        info
    Parsers_File     parsers.conf

# Docker 컨테이너 로그 수집
[INPUT]
    Name             forward
    Listen           0.0.0.0
    Port             24224

# Spring Blue 서비스 로그 처리
[FILTER]
    Name             parser
    Match            spring.blue
    Key_Name         log
    Parser           spring_json
    Reserve_Data     On

# Spring Green 서비스 로그 처리
[FILTER]
    Name             parser
    Match            spring.green
    Key_Name         log
    Parser           spring_json
    Reserve_Data     On

# Redis 서비스 로그 처리
[FILTER]
    Name             parser
    Match            redis.service
    Key_Name         log
    Parser           redis
    Reserve_Data     On

# ERROR 로그에 별도 태그 붙이기
[FILTER]
    Name             rewrite_tag
    Match            spring.*
    Rule             level ERROR spring-error true
    Emitter_Name     spring-error-emitter

# 모든 로그를 일반 로그 그룹으로 (spring)
[OUTPUT]
    Name             cloudwatch_logs
    Match            spring.blue
    region           ap-northeast-2
    log_group_name   doomz-spring-app
    log_stream_prefix blue-
    auto_create_group true

[OUTPUT]
    Name             cloudwatch_logs
    Match            spring.green
    region           ap-northeast-2
    log_group_name   doomz-spring-app
    log_stream_prefix green-
    auto_create_group true

# Redis 로그
[OUTPUT]
    Name             cloudwatch_logs
    Match            redis.service
    region           ap-northeast-2
    log_group_name   doomz-spring-app
    log_stream_prefix redis-
    auto_create_group true

# ERROR 로그만 별도 로그 그룹으로
[OUTPUT]
    Name             cloudwatch_logs
    Match            spring-error
    region           ap-northeast-2
    log_group_name   doomz-spring-app-errors
    log_stream_prefix error-
    auto_create_group true