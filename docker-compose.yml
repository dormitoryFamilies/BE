version: '3'
services:
  redis:
    container_name: redis
    image: "redis:latest"
    ports:
      - "6379:6379"
    environment:
      TZ: "Asia/Seoul"

  elasticsearch:
    container_name: elasticsearch
    image: "docker.elastic.co/elasticsearch/elasticsearch:7.17.9"
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - TZ=Asia/Seoul
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elastic

  spring-blue:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - elasticsearch
    environment:
      TZ: "Asia/Seoul"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
    env_file:
      - .env
    networks:
      - elastic

  spring-green:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - elasticsearch
    environment:
      TZ: "Asia/Seoul"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
    env_file:
      - .env
    networks:
      - elastic

volumes:
  elasticsearch-data:

networks:
  elastic:
    driver: bridge